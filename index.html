<!doctype html>
<html lang="ru" data-read="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desharhozam</title>
<meta name="description" content="Читалка: открывает FB2, EPUB, PDF, DOCX и TXT в одну удобную колонку, хранит цитаты и мысли.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Desharhozam">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html,body{margin:0;height:100%;background:#fff}</style>
</head>
<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Literata:opsz,wght@7..72,400..600&family=Source+Serif+4:opsz,wght@8..60,400..600&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
/* Layout: one column. Library: the book you are reading on top as one card, the rest as a grid of covers, a dock at the bottom. Reader: bare text and one row at the bottom (back, chapter and percent, type); the row turns into copy / keep when a passage is picked. */
:root{
  color-scheme:dark;
  --gut:16px; --pad:20px; --tx:calc(var(--gut) + var(--pad));
  --gap-in:8px; --gap:12px; --gap-far:24px;
  --r-card:28px; --r-ctl:16px;
  --h-s:28px; --h-m:40px; --h-l:52px;
  --tbb:calc(clamp(10px,2.2vh,20px) + env(safe-area-inset-bottom,0px));
  --bg:#212121; --surf:#2a2a2a; --ink:#ececec; --ink-2:#d6d6d6; --ink-3:#b4b4b4; --ink-4:#8f8f8f;
  --line:#ffffff1a; --line-2:#ffffff2b; --mark:#ffffff2e; --pri:#ffffff; --pri-on:#0d0d0d;
  /* floating controls follow the page: a step lighter on dark, a step darker on light */
  --chrome:#2f2f2f; --on:#ececec; --on-2:#b4b4b4; --on-soft:#ffffff14; --on-soft-2:#ffffff26; --shade:#00000059;
  --light:#ececec; --danger:#ff7b72;
  --font:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --serif:Literata,'Iowan Old Style',Georgia,serif;
  --read:var(--font); --fs:19px; --fw:400;
  --ease:cubic-bezier(.22,1,.36,1);
}
:root[data-read="light"]{color-scheme:light;--bg:#ffffff;--surf:#f9f9f9;--ink:#0d0d0d;--ink-2:#2f2f2f;--ink-3:#5d5d5d;--ink-4:#8f8f8f;--line:#0000001a;--line-2:#00000029;--mark:#0000001f;--pri:#0d0d0d;--pri-on:#ffffff;
  --chrome:#f4f4f4;--on:#0d0d0d;--on-2:#5d5d5d;--on-soft:#0000000f;--on-soft-2:#0000001f;--shade:#0000001f;--light:#0d0d0d;--danger:#d92d20}
:root[data-read="paper"]{color-scheme:light;--bg:#faf9f5;--surf:#f0eee6;--ink:#141413;--ink-2:#3d3d3a;--ink-3:#73726c;--ink-4:#a3a199;--line:#1414131a;--line-2:#14141329;--mark:#1414131f;--pri:#141413;--pri-on:#faf9f5;
  --chrome:#f0eee6;--on:#141413;--on-2:#73726c;--on-soft:#1414130f;--on-soft-2:#1414131f;--shade:#1414131a;--light:#141413;--danger:#b53333}
@media(max-width:380px){:root{--pad:16px}}
@supports (width:round(down,1px,1px)){:root{--tbb:calc(round(down,clamp(10px,2.2vh,20px),1px) + env(safe-area-inset-bottom,0px))}}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--font);transition:background .3s}
button,input{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0}
button{cursor:pointer}
:focus-visible{outline:1.5px solid var(--light);outline-offset:2px}
.app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--bg);transition:background .3s}
svg{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* one set of state marks everywhere: a ring that fills, a check, an alert */
.ring{width:20px;height:20px;flex:none;stroke-width:2}
.ring .tr{stroke:var(--line-2)}
.ring .ar{stroke:var(--light);transition:stroke-dasharray .3s}
.ring.ok{stroke:var(--light)}
.ring.bad{stroke:var(--danger)}
.ring.spin{animation:turn 1s linear infinite}
@keyframes turn{to{transform:rotate(1turn)}}
.job .ring .tr,.rpill .ring .tr{stroke:var(--on-soft-2)}
/* floating controls */
.round,.rpill,.act,.seg.big,.job,.sheet{background:var(--chrome);color:var(--on);box-shadow:inset 0 0 0 1px var(--line)}
.round{width:var(--h-l);height:var(--h-l);flex:none;border-radius:50%;display:grid;place-items:center;font-weight:500;transition:transform .14s var(--ease),background .2s,color .2s}
.round:active,.act:active,.rpill:active{transform:scale(.96)}
.round svg{width:18px;height:18px}
/* a choice: the marker slides under the chosen option */
.seg{position:relative;display:flex;height:var(--h-m);padding:4px;border-radius:20px;background:var(--on-soft)}
.seg .th{position:absolute;top:4px;bottom:4px;border-radius:16px;background:var(--on);transition:left .28s var(--ease),right .28s var(--ease)}
.seg button{position:relative;flex:1;min-width:0;border-radius:16px;font-size:13px;color:var(--on-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .2s}
.seg button[aria-pressed="true"]{color:var(--chrome)}
.seg.big{width:216px;height:var(--h-l);border-radius:26px}
.seg.big .th,.seg.big button{border-radius:22px}
.seg.big button{font-size:14px}

/* library */
.scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:var(--gap-far) var(--gut) calc(var(--tbb) + var(--h-l) + 2*var(--gap-far));scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
h1{margin:0 0 var(--gap-far);padding-inline:var(--pad);font-size:28px;font-weight:400;letter-spacing:-.035em;line-height:1.1}
#count{color:var(--ink-3)}
.hint{margin:var(--pad) 0 0;padding-inline:var(--pad);font-size:13px;color:var(--ink-3);text-wrap:pretty}
/* a cover is set from the book's own title; its colour is fixed by the title */
.cv{position:relative;display:block;aspect-ratio:3/4;border-radius:10px;overflow:hidden;pointer-events:none;box-shadow:inset 0 0 0 1px #0000001f}
.cv i{position:absolute;left:14px;right:14px;top:14px;font-style:normal;font-size:11px;line-height:1.3;opacity:.8;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cv em{position:absolute;right:-4px;top:18px;font:400 120px/1 var(--serif);font-style:normal;opacity:.13}
.cv b{position:absolute;left:14px;right:14px;bottom:18px;font:400 19px/1.12 var(--serif);letter-spacing:-.01em;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cv u{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:currentColor;opacity:.9}
.hero{position:relative;display:flex;gap:var(--pad);padding:var(--pad);margin-bottom:var(--gap-far);border-radius:var(--r-card);background:var(--surf);box-shadow:inset 0 0 0 1px var(--line);animation:rise .34s var(--ease) both}
.hero .cv{width:112px;flex:none}
.hero .cv b{font-size:14px;left:10px;right:10px;bottom:12px}
.hero .cv i{left:10px;right:10px;top:10px;font-size:9px}
.hero .cv em{font-size:76px}
.hopen,.topen{position:absolute;inset:0;border-radius:inherit}
.hmeta{flex:1;min-width:0;display:flex;flex-direction:column;pointer-events:none}
.hmeta b{padding-right:var(--h-s);font:400 24px/1.12 var(--serif);letter-spacing:-.015em;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hmeta>i{margin-top:6px;font-style:normal;font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hmeta span{margin-top:auto;padding-top:var(--gap);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.hrow{display:flex;align-items:center;gap:var(--gap);margin-top:var(--gap)}
.hring{position:relative;width:var(--h-m);height:var(--h-m);flex:none;display:grid;place-items:center;font-size:11px;font-style:normal;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.hring svg{position:absolute;inset:0;width:100%;height:100%}
/* the primary action is the one light button on the screen */
.hmeta em{height:var(--h-m);padding-inline:var(--pad);border-radius:20px;display:grid;place-items:center;font-style:normal;font-weight:500;background:var(--pri);color:var(--pri-on)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--pad) var(--gap)}
.tile{position:relative;min-width:0;display:flex;flex-direction:column;gap:var(--gap-in);border-radius:12px;animation:rise .34s var(--ease) both}
.tm .ring{width:14px;height:14px}
.tm{display:flex;align-items:center;gap:6px;padding-inline:4px;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kx{position:absolute;z-index:1;top:8px;right:8px;min-width:var(--h-s);height:var(--h-s);border-radius:14px;display:grid;place-items:center;background:#0000008c;color:#fff;font-size:13px}
.hero .kx{top:var(--gap);right:var(--gap);background:var(--line);color:var(--ink-3)}
.kx.ask{padding-inline:12px;background:#000000c7;color:var(--danger)}
.kx svg{width:12px;height:12px}
/* the library: the book in hand on top, the rest as plain rows under a hairline */
.ed{margin:0 calc(-1*var(--gut))}
.ed-top{position:relative;display:flex;gap:var(--pad);padding:0 var(--tx) var(--gap-far);border-bottom:1px solid var(--line)}
.ed-top .cv{width:104px;flex:none;align-self:flex-start}
.ed-top .cv b,.ed-top .cv i{display:none}
.ed-top .cv em{font-size:84px;top:14px}
.ed-body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding-right:var(--h-s)}
.ed-title{margin:0;font:400 24px/1.15 var(--font);letter-spacing:-.025em;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ed-auth{margin:6px 0 0;font-size:14px;color:var(--ink-3)}
.ed-meta{margin:auto 0 0;padding-top:var(--gap);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ed-go{position:relative;z-index:1;margin-top:var(--gap);height:var(--h-m);padding-inline:var(--pad);border-radius:20px;background:var(--pri);color:var(--pri-on);font-weight:500;transition:transform .14s var(--ease)}
.ed-go:active{transform:scale(.97)}
.eopen{position:absolute;inset:0}
.erow{position:relative;display:flex;align-items:center;gap:var(--gap);padding:var(--gap) var(--tx);animation:rise .3s var(--ease) both}
.erow+.erow::before{content:"";position:absolute;top:0;left:var(--tx);right:var(--tx);height:1px;background:var(--line)}
.et{flex:1;min-width:0;pointer-events:none}
.et b{display:block;font-weight:400;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.et i{display:block;margin-top:2px;font-style:normal;font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.erow .ring{pointer-events:none}
.ed .kx{position:relative;top:auto;right:auto;flex:none;background:none;color:var(--ink-4)}
.ed .kx.ask{background:var(--surf);color:var(--danger)}
.ed-top .kx{position:absolute;top:-4px;right:var(--gut)}
/* ===== screens: home, search, notes, book page ===== */
.view{animation:rise .3s var(--ease) both}
.h{margin:0 0 var(--pad);padding:0;text-align:center;font-size:28px;font-weight:400;letter-spacing:-.035em;line-height:1.1}
.sec{margin:44px 0 var(--pad);text-align:center;font-size:24px;font-weight:400;letter-spacing:-.03em;line-height:1.1}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* the book in hand: one card, title first, then a few lines of the book itself, the cover as a band, one action */
.hc{position:relative;padding:var(--pad);border-radius:var(--r-card);background:var(--surf);box-shadow:inset 0 0 0 1px var(--line)}
.hc h2{margin:0;font:400 clamp(32px,10vw,44px)/1 var(--font);letter-spacing:-.045em;overflow-wrap:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hc .ex{margin:var(--gap-far) 0 0;font-size:14px;line-height:1.4;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hc .mt{margin:var(--gap) 0 0;padding-top:var(--gap);border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.band{position:relative;display:block;width:100%;height:148px;margin-top:var(--gap);border-radius:20px;overflow:hidden}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.band em{position:absolute;right:8px;bottom:-34px;font:400 190px/1 var(--serif);font-style:normal;opacity:.18}
.band u{position:absolute;left:0;bottom:0;height:3px;width:calc(var(--p,0)*100%);background:currentColor}
.rowb{display:flex;gap:var(--gap-in);margin-top:var(--gap)}
.pillb{flex:1;min-width:0;height:var(--h-l);border-radius:26px;background:var(--pri);color:var(--pri-on);font-weight:500;transition:transform .14s var(--ease)}
.pillb.sub{background:none;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.pillb:active,.circ:active{transform:scale(.97)}
.circ{width:var(--h-l);height:var(--h-l);flex:none;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1px var(--line-2);transition:transform .14s var(--ease)}
.circ svg{width:18px;height:18px}
/* a ribbon of large cards: the one in the middle is full size, its neighbours peek in from the sides */
.car{display:flex;gap:var(--gap-in);margin-inline:calc(-1*var(--gut));padding:4px 15%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.cc{flex:0 0 100%;min-width:0;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;text-align:center;will-change:transform}
.cc .cv{width:100%;border-radius:24px}
.cc b{display:block;max-width:100%;margin-top:var(--gap);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc i{display:block;max-width:100%;margin-top:2px;font-style:normal;font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.cc.q{align-items:stretch;text-align:left;padding:var(--pad);border-radius:24px;background:var(--surf);box-shadow:inset 0 0 0 1px var(--line)}
.cc.q p{margin:0;font:400 17px/1.45 var(--serif);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.cc.q i{margin-top:var(--gap)}
/* bottom bar: the tab you are on opens into a filled pill with its name */
.nav{position:absolute;z-index:3;left:50%;bottom:var(--tbb);transform:translateX(-50%);display:flex;align-items:center;gap:var(--gap-in)}
.nav .t{height:var(--h-l);padding-inline:17px;border-radius:26px;display:flex;align-items:center;background:var(--chrome);color:var(--on);box-shadow:inset 0 0 0 1px var(--line),0 4px 16px var(--shade);transition:background .25s,color .25s,transform .14s var(--ease)}
.nav .t:active{transform:scale(.96)}
.nav .t svg{width:18px;height:18px;flex:none}
.nav .t span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-weight:500;transition:max-width .36s var(--ease),opacity .2s,margin .36s var(--ease)}
.nav .t.on{background:var(--pri);color:var(--pri-on)}
.nav .t.on span{max-width:96px;margin-left:8px;opacity:1}
/* search */
.search{display:flex;align-items:center;gap:var(--gap);height:var(--h-l);padding-inline:var(--pad);border-radius:26px;box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink-3);transition:box-shadow .2s}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--ink-3)}
.search svg{width:18px;height:18px;flex:none}
.search input{flex:1;min-width:0;outline:none;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--ink-4)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-in);margin-top:var(--gap)}
.tl{padding:var(--gap) var(--gap) var(--pad);border-radius:24px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;gap:var(--gap);transition:background .2s,transform .14s var(--ease)}
.tl:active{transform:scale(.98)}
.tl b{width:72%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--surf);font:400 44px/1 var(--font);letter-spacing:-.04em;font-variant-numeric:tabular-nums;transition:background .25s,color .25s}
.tl.on b{background:var(--pri);color:var(--pri-on)}
.rows{margin:var(--gap) calc(-1*var(--gut)) 0}
.rows mark{background:var(--mark);color:inherit;border-radius:3px}
.et b.wrap{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15px;line-height:1.35}
.sub{margin:var(--gap-far) 0 0;padding-inline:var(--pad);font-size:13px;color:var(--ink-3)}
/* book page */
.bpage{position:absolute;inset:0;z-index:4;background:var(--bg);transform:translateX(100%);visibility:hidden;transition:transform .36s var(--ease),visibility 0s .36s,background .3s}
.bpage.on{transform:none;visibility:visible;transition:transform .36s var(--ease),background .3s}
.bscroll{height:100%;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--gut) + var(--h-l) + var(--gap)) var(--gut) calc(var(--tbb) + var(--gap-far));scrollbar-width:none}
.bscroll::-webkit-scrollbar{display:none}
.bback{position:absolute;top:var(--gut);left:var(--gut)}
.bp-cv{width:58%;margin:0 auto;border-radius:24px}
.bp-t{margin:var(--pad) 0 0;text-align:center;font:400 30px/1.08 var(--font);letter-spacing:-.04em;text-wrap:balance;overflow-wrap:break-word}
.bp-a{margin:6px 0 0;text-align:center;color:var(--ink-3)}
.bp-m{margin:var(--gap) 0 0;text-align:center;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bp-x{margin:0;padding-inline:var(--pad);font-size:15px;line-height:1.5;color:var(--ink-2);text-wrap:pretty}
.chr{position:relative;display:flex;gap:var(--gap);width:100%;padding:var(--gap) var(--pad);text-align:left}
.chr+.chr::before{content:"";position:absolute;top:0;left:var(--pad);right:var(--pad);height:1px;background:var(--line)}
.chr span{flex:none;width:24px;color:var(--ink-4);font-size:13px;line-height:21px;font-variant-numeric:tabular-nums}
.chr b{flex:1;min-width:0;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chr.now b{font-weight:500}
.chr.now::after{content:"";align-self:center;width:6px;height:6px;border-radius:50%;background:var(--pri)}
.facts{margin:0;padding-inline:var(--pad);display:grid;grid-template-columns:auto 1fr;gap:var(--gap-in) var(--gap);font-size:15px}
.facts dt{color:var(--ink-3)}
.facts dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.drop{display:block;margin:44px auto 0;height:var(--h-m);padding-inline:var(--pad);border-radius:20px;color:var(--ink-3);transition:color .2s,background .2s}
.drop.ask{color:var(--danger);background:var(--surf)}
.notes{margin-top:0}
/* kept passages */
.notes{display:flex;flex-direction:column;gap:var(--gap)}
.note{padding:var(--pad);border-radius:var(--r-card);background:var(--surf);box-shadow:inset 0 0 0 1px var(--line);animation:rise .34s var(--ease) both}
.note p{margin:0;font:400 18px/1.45 var(--serif);white-space:pre-line;text-wrap:pretty;overflow-wrap:break-word}
.note small{display:block;margin-top:var(--gap);font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nrow{display:flex;gap:var(--gap-in);margin-top:var(--pad)}
.nb{height:var(--h-m);min-width:var(--h-m);border-radius:20px;display:grid;place-items:center;background:var(--line);transition:transform .14s var(--ease),background .2s,color .2s}
.nb:active{transform:scale(.96)}
.nb.wide{flex:1;font-weight:500}
.nb.ok{background:var(--pri);color:var(--pri-on)}
.nb svg{width:18px;height:18px}
.ldock{position:absolute;z-index:3;left:var(--gut);right:var(--gut);bottom:var(--tbb);display:flex;justify-content:space-between;pointer-events:none}
.ldock>*{pointer-events:auto}
.job{position:absolute;z-index:3;left:50%;bottom:calc(var(--tbb) + var(--h-l) + var(--gap));max-width:calc(100% - 2*var(--gut));height:var(--h-l);padding:0 var(--pad) 0 6px;border-radius:26px;display:flex;align-items:center;gap:var(--gap);white-space:nowrap;font-variant-numeric:tabular-nums;
  opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .25s,transform .3s var(--ease)}
.job.on{opacity:1;transform:translate(-50%,0)}
.job b{height:var(--h-m);min-width:var(--h-m);padding-inline:10px;border-radius:20px;display:grid;place-items:center;background:var(--on-soft);font-size:12px;font-weight:500}
.job>span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.job>span:last-of-type{display:grid;flex:none}
.job i{width:1px;height:16px;flex:none;background:var(--on-soft-2)}
.job em{font-style:normal;font-size:13px;color:var(--on-2)}
.job.bad>span{color:var(--danger)}
.app.drag #add{background:var(--on);color:var(--chrome)}

/* reader */
.reader{position:absolute;inset:0;z-index:5;background:var(--bg);transform:translateY(100%);visibility:hidden;transition:transform .36s var(--ease),visibility 0s .36s,background .3s}
.reader.on{transform:none;visibility:visible;transition:transform .36s var(--ease),background .3s}
.rscroll{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(var(--gap-far) + 20px) var(--tx) calc(var(--tbb) + var(--h-l) + 30vh);scrollbar-width:none}
.rscroll::-webkit-scrollbar{display:none}
article{font-family:var(--read);font-size:var(--fs);font-weight:var(--fw);line-height:1.6;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;text-align:left}
article>*{border-radius:6px;transition:background .2s,box-shadow .2s}
article p{margin:0 0 .8em;text-wrap:pretty}
article h2{margin:1.7em 0 .7em;font-family:var(--serif);font-size:1.4em;font-weight:400;line-height:1.2;letter-spacing:-.01em;text-wrap:balance;hyphens:manual}
article .bt{margin:0 0 .25em;font-family:var(--serif);font-size:1.8em;line-height:1.1;font-weight:400;letter-spacing:-.015em;text-wrap:balance;hyphens:manual}
article .ba{margin:0 0 2em;font-family:var(--font);font-size:14px;font-weight:400;color:var(--ink-3)}
article .q{padding-left:var(--pad);font-style:italic;color:var(--ink-2);white-space:pre-line}
article .v{white-space:pre-line;hyphens:manual;text-wrap:wrap;margin-bottom:1.1em}
article .s{margin:1.4em 0 .8em;text-align:center;font-family:var(--serif);color:var(--ink-3)}
article mark{color:inherit;background:var(--mark);border-radius:3px;padding:.12em 0;-webkit-box-decoration-break:clone;box-decoration-break:clone}
article .pick{background:var(--line);box-shadow:0 0 0 8px var(--line)}
.fade{position:absolute;left:0;right:0;z-index:2;pointer-events:none;transition:opacity .3s}
.fade.t{top:0;height:12%;background:linear-gradient(var(--bg) 25%,transparent)}
.fade.b{bottom:0;height:18%;background:linear-gradient(transparent,var(--bg) 75%)}
.reader.plain .fade.t{height:24px}
.reader.plain .fade.b{height:calc(var(--tbb) + 40px)}
/* the bottom row */
.rdock{position:absolute;z-index:4;left:var(--gut);right:var(--gut);bottom:var(--tbb);display:flex;gap:var(--gap-in);transition:transform .32s var(--ease),opacity .22s}
.rpill{flex:1;min-width:0;height:var(--h-l);border-radius:26px;display:flex;align-items:center;gap:var(--gap-in);padding:6px 6px 6px var(--pad);transition:transform .14s var(--ease)}
.rpill svg{width:16px;height:16px;flex:none;color:var(--on-2)}
.rpill b{flex:1;min-width:0;text-align:left;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rpill span{flex:none;height:var(--h-m);padding:0 12px 0 10px;border-radius:20px;display:flex;align-items:center;gap:6px;background:var(--on-soft);font-size:13px;font-variant-numeric:tabular-nums}
.act{flex:1;min-width:0;height:var(--h-l);border-radius:26px;font-weight:500;transition:transform .14s var(--ease),background .2s,color .2s}
.act.pri,.act.ok,.reader.s-set #aa{background:var(--pri);color:var(--pri-on)}
.reader.quiet #rdock{transform:translateY(calc(100% + var(--tbb) + 8px));opacity:0}
#pbar,.reader.pick #rdock{opacity:0;pointer-events:none;transform:translateY(12px)}
.reader.pick #pbar{opacity:1;pointer-events:auto;transform:none}
.sheet{position:absolute;z-index:4;left:var(--gut);right:var(--gut);bottom:calc(var(--tbb) + var(--h-l) + var(--gap-in));border-radius:var(--r-card);opacity:0;pointer-events:none;transform:translateY(12px) scale(.98);transform-origin:50% 100%;transition:opacity .18s,transform .3s var(--ease)}
.sheet{transform:none;opacity:1;clip-path:inset(100% 0 0 0 round var(--r-card));transition:clip-path .36s var(--ease)}
.reader.s-set #pset,.reader.s-toc #ptoc{pointer-events:auto;clip-path:inset(0 round var(--r-card))}
/* the ruler: the whole book on one line; taller ticks are chapters; drag the frame to move */
.ruler{position:relative;height:var(--h-m);margin:var(--gap) var(--gap-in) 0;touch-action:none;cursor:ew-resize;background:repeating-linear-gradient(90deg,var(--on-soft-2) 0 1px,transparent 1px 8px) 0 50%/100% 8px no-repeat}
.ruler u{position:absolute;top:9px;bottom:9px;width:1px;background:var(--on-2)}
.ruler i{position:absolute;top:8px;bottom:8px;left:calc(var(--p,0)*100%);width:20px;margin-left:-10px;border:1.5px solid var(--on);border-radius:7px;background:var(--chrome);transition:transform .14s var(--ease)}
.ruler:active i{transform:scale(1.12)}
.set{display:flex;flex-direction:column;gap:var(--pad);padding:var(--pad)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:var(--gap)}
.set label,.srow>span{display:block;margin-bottom:var(--gap-in);font-size:13px;color:var(--on-2)}
.srow>span{margin:0}
.step{display:flex;align-items:center;gap:var(--gap)}
.step b{min-width:28px;text-align:center;font-weight:400;font-variant-numeric:tabular-nums}
.step button{width:var(--h-m);height:var(--h-m);border-radius:50%;display:grid;place-items:center;background:var(--on-soft);transition:transform .14s var(--ease)}
.step button:active{transform:scale(.92)}
.step svg{width:18px;height:18px}
.thead{padding:var(--gap) var(--gap) 0}
.thead p{margin:var(--gap) var(--gap-in) 0;font-size:13px;color:var(--on-2);font-variant-numeric:tabular-nums}
.toc{max-height:44vh;overflow-y:auto;padding:var(--gap-in);scrollbar-width:none}
.toc button{display:block;width:100%;padding:10px var(--gap);border-radius:var(--r-ctl);text-align:left;color:var(--on-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc button.now{color:var(--on);background:var(--on-soft)}
.toc button.q{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35;color:var(--on)}
.toc p{margin:0;padding:var(--gap);color:var(--on-2)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== clean pass: one type scale, one spacing scale, flat surfaces, air ===== */
/* type: 12 caption · 14 secondary · 16 body · 22 section · 28 screen · 40 hero. Regular everywhere; medium only on things you press */
/* space: 4 · 8 · 12 · 20 · 24, and 72 between sections */
.scroll{padding-top:40px}
.h{margin-bottom:var(--gap-far)}
.sec{margin:72px 0 var(--gap-far);font-size:22px;letter-spacing:-.025em}
.hc{padding:0 var(--pad);background:none;box-shadow:none;border-radius:0}
.hc h2{font-size:40px;line-height:1.02;letter-spacing:-.045em;text-wrap:balance}
.hc .mt{margin:var(--gap) 0 0;padding:0;border:0;font-size:14px;color:var(--ink-3)}
.stage{display:grid;place-items:center;width:100%;height:320px;perspective:1000px}
.stage .cv{width:164px;border-radius:6px;transform:rotateY(-26deg) rotateX(7deg) rotateZ(1.5deg);transform-origin:50% 50%;
  box-shadow:inset 0 0 0 1px #00000026,1px 0 0 #00000040,26px 30px 50px -18px var(--shade);transition:transform .5s var(--ease)}
.stage:active .cv{transform:rotateY(-12deg) rotateX(3deg)}
.hc .rowb{margin:0}
/* covers set from the title */
.cv{container-type:inline-size;text-align:left;border-radius:6px;box-shadow:inset 0 0 0 1px #00000026}
.cv b{position:absolute;left:9cqw;right:9cqw;top:9cqw;bottom:auto;font:500 10.5cqw/1.08 var(--font);letter-spacing:-.03em;-webkit-line-clamp:5}
.cv i{position:absolute;left:9cqw;right:9cqw;top:auto;bottom:9cqw;padding-top:4cqw;border-top:1px solid currentColor;font-size:5.6cqw;line-height:1.2;opacity:.7;-webkit-line-clamp:2}
.cv u{height:2px}
.hero .cv b,.hero .cv i,.ed-top .cv b,.ed-top .cv i{display:block}
/* ribbons */
.car{padding:var(--gap) 20%;gap:var(--gap-in)}
.cc .cv{border-radius:6px}
.cc b{margin-top:var(--pad);font-size:16px;font-weight:500}
.cc i{font-size:14px}
.cc.q{border-radius:var(--r-card);background:none;box-shadow:inset 0 0 0 1px var(--line-2)}
/* lists and cards without fills */
.note{background:none;box-shadow:inset 0 0 0 1px var(--line-2)}
.note small,.et i,.sub,.bp-m,.tm{font-size:14px}
.et b{font-size:16px}
.erow{padding-block:14px}
.tl b{background:none;box-shadow:inset 0 0 0 1px var(--line-2);font-size:40px}
.tl span{font-size:14px}
/* book page */
.bp-cv{width:52%}
.bp-t{margin-top:var(--gap-far);font-size:28px;letter-spacing:-.035em}
.bp-x,.facts,.chr b{font-size:16px}
.bscroll>.rowb{margin-top:var(--gap-far)}
.drop{margin-top:72px}

/* ===== quiet pass: few controls, each one changes state instead of opening something new ===== */
.lt{margin:0 0 var(--gap);padding-inline:var(--pad);font-size:34px;font-weight:500;letter-spacing:-.035em;line-height:1.1}
.scroll{padding-top:var(--gap-far)}
.search{margin-bottom:var(--gap-in);background:var(--on-soft);box-shadow:none;height:44px;border-radius:22px;padding-inline:16px}
.search:focus-within{box-shadow:inset 0 0 0 1px var(--line-2)}
/* a book is a row: cover, name, state, and one small button that reads it */
.brow{position:relative;display:flex;align-items:center;gap:var(--gap);padding:10px var(--tx);animation:rise .3s var(--ease) both}
.brow+.brow::before{content:"";position:absolute;top:0;right:var(--tx);left:calc(var(--tx) + 52px + var(--gap));height:1px;background:var(--line)}
.brow:active{background:var(--on-soft)}
.cv.th{width:52px;flex:none;border-radius:6px}
.cv.th b,.cv.th i,.cv.th u{display:none}
.cv em{position:absolute;inset:0;right:0;top:0;display:grid;place-items:center;font:500 20px/1 var(--font);font-style:normal;opacity:1}
.get{position:relative;z-index:1;flex:none;height:32px;min-width:68px;padding-inline:14px;border-radius:16px;display:grid;place-items:center;background:var(--on-soft);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;transition:transform .14s var(--ease),background .2s}
.get:active{transform:scale(.96)}
.get.pri{background:var(--pri);color:var(--pri-on)}
.get svg{width:16px;height:16px}
/* the book page grows out of its row and folds back into it */
.bpage{transform:none;transition:clip-path .42s var(--ease),visibility 0s .42s}
.bpage.on{transition:clip-path .42s var(--ease)}
.bpage .bscroll>*{animation:rise .4s var(--ease) .08s both}
/* adding a book: the plus stretches into a line of status across the bar, then closes back */
.ldock{transition:opacity .2s}
.app.busy .ldock{opacity:0;pointer-events:none}
.job{left:var(--gut);right:var(--gut);bottom:var(--tbb);max-width:none;transform:none;opacity:1;visibility:hidden;clip-path:inset(0 0 0 calc(100% - 52px) round 26px);transition:clip-path .4s var(--ease),visibility 0s .4s}
.job.on{transform:none;visibility:visible;clip-path:inset(0 round 26px);transition:clip-path .4s var(--ease)}
.job>span:first-of-type{flex:1}
/* removing takes a held press: the bar fills while you hold and empties if you let go */
.hold{position:relative;display:block;width:100%;height:var(--h-l);margin-top:72px;border-radius:26px;overflow:hidden;color:var(--danger);font-weight:500;box-shadow:inset 0 0 0 1px var(--line-2);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .14s var(--ease)}
.hold i{position:absolute;inset:0;background:color-mix(in srgb,var(--danger) 24%,transparent);clip-path:inset(0 100% 0 0);transition:clip-path .2s ease-out}
.hold.go{transform:scale(.98)}
.hold.go i{clip-path:inset(0);transition:clip-path 1.1s linear}
.hold span{position:relative}

/* notes: the book's words in serif, yours in sans; one quiet line of actions */
.note{padding:var(--pad)}
.note .nq{margin:0;padding:0;font:400 18px/1.45 var(--serif);white-space:pre-wrap;overflow-wrap:break-word}
.note ins{font-family:var(--font);font-size:.92em;text-decoration:none;background:var(--mark);border-radius:3px;padding:.1em .2em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.nthought,.nadd{display:block;width:100%;margin-top:var(--gap);text-align:left;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:break-word}
.nthought{padding-left:var(--gap);border-left:2px solid var(--ink-3);color:var(--ink)}
.nadd{color:var(--ink-4);font-size:14px}
.note textarea{display:block;width:100%;border:0;outline:0;background:none;resize:none;overflow:hidden;color:inherit;border-radius:0}
.note textarea.nt{margin-top:var(--gap);padding-left:var(--gap);border-left:2px solid var(--ink-3);font:400 16px/1.45 var(--font)}
.note textarea::placeholder{color:var(--ink-4)}
.nfoot{display:flex;align-items:center;gap:4px;margin:var(--gap) -6px -6px 0}
.nsrc{flex:1;min-width:0;display:flex;align-items:center;gap:4px;height:32px;text-align:left;font-size:14px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nsrc span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.nsrc svg{width:12px;height:12px;flex:none}
.ni{min-width:32px;height:32px;padding-inline:8px;border-radius:16px;display:grid;place-items:center;font-size:14px;color:var(--ink-3);transition:background .2s,color .2s,transform .14s var(--ease)}
.ni:active,.nsrc:active{transform:scale(.96)}
.ni svg{width:16px;height:16px}
.ni.ask{background:var(--on-soft);color:var(--danger)}

/* ================= system =================
   TYPE (iOS text styles, size/leading · weight · tracking for Inter)
     large title 34/41 · 700 · -.022em      screen names
     title 1     28/34 · 700 · -.021em      the book's name on its page
     title 2     22/28 · 700 · -.018em      section names
     headline    17/22 · 600 · -.013em      the label on a main button
     body        17/22 · 400 · -.013em      names in lists, values, fields
     subhead     15/20 · 400 · -.009em      second line in lists, thoughts, small buttons (600)
     footnote    13/18 · 400 · -.003em      sources, hints, facts under titles; segmented labels (500)
     caption     12/16 · 400 · 0            numbers of chapters, format marks
   Regular reads; Semibold is pressed; Bold names a screen or a section; Medium only at 13 and below.
   SPACE  4 · 8 · 12 · 16 · 20 · 24 · 32. Screen margin 16, content margin 20, reading margin 24. 32 above a section, 12 below its name.
   RADIUS a control is a capsule (height / 2). A surface: sheet 28, card 24, cover 8.
          Inside a surface: inner = outer − distance to the edge, never under 8. Capsules stay capsules.
   TOUCH  nothing you press is under 44 × 44, even when it is drawn smaller.
   MOTION feedback on press ≤150ms; a change of state 200–300ms; a new surface 360–420ms from where it came.
          Nothing animates while you type, scroll or read. */
:root{--tx:calc(var(--gut) + 4px);--r-card:24px;--r-ctl:20px;
  --ls-34:-.022em;--ls-28:-.021em;--ls-22:-.018em;--ls-17:-.013em;--ls-15:-.009em;--ls-13:-.003em}
body{font-size:17px;line-height:22px;letter-spacing:var(--ls-17)}
/* large title */
.lt{padding-inline:4px;margin:0 0 8px;font-size:34px;line-height:41px;font-weight:700;letter-spacing:var(--ls-34)}
/* title 1 */
.bp-t{margin-top:24px;font-size:28px;line-height:34px;font-weight:700;letter-spacing:var(--ls-28)}
/* title 2: section names sit on the content line, not in the middle */
.sec{margin:32px 0 12px;padding-inline:4px;text-align:left;font-size:22px;line-height:28px;font-weight:700;letter-spacing:var(--ls-22)}
/* headline: main buttons */
.pillb,.act,.hold,.ed-go{font-size:17px;line-height:22px;font-weight:600;letter-spacing:var(--ls-17)}
/* body */
.et b,.chr b,.facts,.search input,.bp-x,.toc button{font-size:17px;line-height:22px;font-weight:400;letter-spacing:var(--ls-17)}
.bp-x{padding-inline:4px;line-height:24px}
.facts{padding-inline:4px;gap:8px 12px}
/* subhead */
.et i,.bp-a,.nthought,.note textarea.nt,.cc i,.set label,.srow>span{font-size:15px;line-height:20px;letter-spacing:var(--ls-15)}
.get,.round#aa{font-size:15px;font-weight:600;letter-spacing:var(--ls-15)}
/* footnote */
.bp-m,.nsrc,.nadd,.hint,.thead p,.ni,.job em{font-size:13px;line-height:18px;letter-spacing:var(--ls-13)}
.seg button{font-size:13px;font-weight:500;letter-spacing:var(--ls-13)}
.seg.big button{font-size:15px;letter-spacing:var(--ls-15)}
/* caption */
.chr span,.job b{font-size:12px;line-height:16px;letter-spacing:0}
.chr span{line-height:22px}
/* quotes keep the serif */
.note .nq{font-size:17px;line-height:26px;letter-spacing:0}
/* space */
.search{margin-bottom:8px}
.brow{padding:8px var(--tx);gap:12px}
.brow+.brow::before{left:calc(var(--tx) + 52px + 12px);right:var(--tx)}
.et i{margin-top:2px}
.note{padding:20px;border-radius:var(--r-card)}
.notes{gap:12px}
.chr{padding:11px 4px}
.chr+.chr::before{left:4px;right:4px}
.bscroll>.rowb{margin-top:20px}
.hold{margin-top:32px}
.rscroll{padding-inline:24px}
.set{gap:20px;padding:20px}
/* radius */
.cv,.cv.th,.cc .cv,.stage .cv{border-radius:8px}
.bp-cv{border-radius:12px}
.sheet{border-radius:28px}
.sheet .toc button{border-radius:20px}
.cc.q{border-radius:var(--r-card)}
article .pick{border-radius:8px}
/* touch: drawn small, pressed large */
.ni{position:relative;min-width:44px;height:44px;margin:-6px -6px -6px 0}
.nfoot{margin:12px -8px -8px 0;gap:0}
.nsrc{height:44px;margin:-6px 0}
.get{isolation:isolate}
.get::after{content:"";position:absolute;inset:-6px -8px}
.step button{width:44px;height:44px}
/* motion: nothing moves while you type */
.rows.q .brow{animation:none}

/* ================= soft surfaces =================
   Three levels: page → tray → cell. A tray groups; a cell is something you read or press.
   Controls are rounded rectangles; a cell inside a tray takes the tray's radius minus the gap (24−6=18, 16−4=12).
   One colour: highlighter yellow, only for what you kept. */
:root{--bg:#151516;--tray:#1c1c1e;--cell:#262628;--bd:#ffffff12;--sh:0 1px 0 #00000059;--acc:#ffd60a;--mark:#ffd60a33;
  --surf:var(--cell);--chrome:var(--tray);--pri:#f5f5f7;--pri-on:#151516;--ink:#f5f5f7;--ink-2:#d1d1d6;--ink-3:#98989f;--ink-4:#6c6c72;--on:var(--ink);--on-2:var(--ink-3);--light:#f5f5f7;--line:#ffffff12;--line-2:#ffffff1f}
:root[data-read="light"]{--bg:#f1f1f4;--tray:#f8f8fa;--cell:#ffffff;--bd:#0000000f;--sh:0 1px 0 #00000014,0 1px 3px #0000000a;--acc:#b58a00;--mark:#ffd60a73;
  --pri:#1c1c1e;--pri-on:#ffffff;--ink:#1c1c1e;--ink-2:#3a3a3c;--ink-3:#6e6e73;--ink-4:#a1a1a6;--light:#1c1c1e;--line:#0000000f;--line-2:#0000001a}
:root[data-read="paper"]{--bg:#f2efe8;--tray:#f8f5ef;--cell:#fffdf8;--bd:#3c2f1a14;--sh:0 1px 0 #3c2f1a1f,0 1px 3px #3c2f1a0a;--acc:#b58a00;--mark:#ffd60a73;
  --pri:#201d18;--pri-on:#fffdf8;--ink:#201d18;--ink-2:#3d3932;--ink-3:#757067;--ink-4:#a8a297;--light:#201d18;--line:#3c2f1a14;--line-2:#3c2f1a24}
.lt,.sec,.bp-t{font-weight:600}
/* cells */
.search,.brow,.round,.rpill,.pillb.sub,.job,.chr,.cc.q,.toast,.pop,#add{background:var(--cell);box-shadow:inset 0 0 0 1px var(--bd),var(--sh)}
/* trays */
.note,.sheet,.facts,.seg{background:var(--tray);box-shadow:inset 0 0 0 1px var(--bd)}
/* library */
.search{height:44px;border-radius:14px;margin-bottom:0}
.rows{margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.brow{padding:8px 12px 8px 8px;border-radius:18px;transition:transform .14s var(--ease)}
.brow:active{background:var(--cell);transform:scale(.985)}
.brow+.brow::before{display:none}
.cv.th{border-radius:10px}
.get{border-radius:10px;background:var(--tray);box-shadow:inset 0 0 0 1px var(--bd)}
.get.pri{background:var(--pri);box-shadow:none}
/* segmented: the chosen option is a cell lifted out of the tray, and shows its icon */
.seg{padding:4px;border-radius:12px;height:40px}
.seg .th{top:4px;bottom:4px;border-radius:8px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--bd),var(--sh)}
.seg button{border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.seg button[aria-pressed="true"]{color:var(--ink)}
.seg button svg{width:0;height:16px;flex:none;opacity:0;transition:width .28s var(--ease),margin .28s var(--ease),opacity .2s}
.seg button[aria-pressed="true"] svg{width:16px;margin-right:6px;opacity:1}
.sheet .seg,.note .seg{background:var(--bg)}
.seg.big{width:232px;height:48px;border-radius:16px}
.seg.big .th,.seg.big button{border-radius:12px}
#add,.round{width:48px;height:48px;border-radius:16px;color:var(--ink)}
.job{height:48px;border-radius:16px;clip-path:inset(0 0 0 calc(100% - 48px) round 16px)}
.job.on{clip-path:inset(0 round 16px)}
.job b{border-radius:10px;background:var(--tray)}
/* notes: the book's words in a cell, your thought and the source on the tray */
.note{padding:6px;border-radius:24px}
.note .nq{padding:14px;border-radius:18px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--bd),var(--sh)}
.nthought,.nadd,.note textarea.nt{margin:12px 14px 0;width:calc(100% - 28px)}
.nfoot{margin:6px 0 0;padding-left:14px}
.note ins{background:var(--mark)}
/* buttons */
.pillb,.act,.hold{height:48px;border-radius:14px}
.pillb.sub{color:var(--ink)}
.hold{background:var(--tray);box-shadow:inset 0 0 0 1px var(--bd)}
/* book page */
.bp-cv{border-radius:14px}
.chr{padding:12px 14px;border-radius:14px;margin-bottom:6px}
.chr+.chr::before{display:none}
.facts{padding:16px 18px;border-radius:20px;gap:14px 12px}
.cc.q{border-radius:18px}
/* reader */
.rdock{gap:6px}
.rpill{height:48px;border-radius:16px;padding:6px 6px 6px 16px}
.rpill span{border-radius:10px;height:36px;background:var(--tray);box-shadow:inset 0 0 0 1px var(--bd)}
.reader.s-set #aa{background:var(--pri);color:var(--pri-on)}
.sheet{border-radius:24px;clip-path:inset(100% 0 0 0 round 24px)}
.reader.s-set #pset,.reader.s-toc #ptoc{clip-path:inset(0 round 24px)}
.st{font-size:17px;line-height:22px;font-weight:600}
.srow b{font-weight:400;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.toc button{border-radius:14px;padding:12px 14px}
.toc button.now{background:var(--cell);box-shadow:inset 0 0 0 1px var(--bd),var(--sh)}
.thead{border-bottom:1px dashed var(--line-2);padding-bottom:12px;margin-bottom:6px}
.ruler i{border-radius:8px;background:var(--cell);border-color:var(--ink-3)}
/* slider */
.rng{-webkit-appearance:none;appearance:none;display:block;width:100%;height:28px;margin:8px 0 0;background:none}
.rng::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ink) calc(var(--v,0)*100%),var(--bg) 0)}
.rng::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ink) calc(var(--v,0)*100%),var(--bg) 0)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:9px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--line-2),var(--sh)}
.rng::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:9px;background:var(--cell);box-shadow:inset 0 0 0 1px var(--line-2),var(--sh)}
/* picking a passage: it is marked, the rest of the page steps back, the menu opens beside it */
article>*{transition:opacity .25s,background .2s,box-shadow .2s}
.reader.pick article>*:not(.pick):not(.keep){opacity:.3}
article .pick{background:var(--mark);box-shadow:0 0 0 6px var(--mark);border-radius:4px}
article mark{background:var(--mark)}
.pop{position:absolute;z-index:6;width:232px;padding:6px;border-radius:20px;box-shadow:inset 0 0 0 1px var(--bd),0 12px 32px var(--shade);opacity:0;transform:scale(.94) translateY(-4px);transform-origin:20% 0;pointer-events:none;transition:opacity .15s,transform .22s var(--ease),top .2s var(--ease)}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop p{margin:0;padding:8px 12px 6px;font-size:13px;line-height:18px;color:var(--ink-3)}
.pmenu button{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding-inline:12px;border-radius:14px;text-align:left;color:var(--ink-2);transition:background .15s,color .15s}
.pmenu button:active{background:var(--tray)}
.pmenu svg{width:18px;height:18px;flex:none}
#psave.ok{color:var(--acc)}
#psave.ok svg{fill:currentColor}
.pthink{display:none;padding:0 6px 6px}
.pop.think .pmenu{display:none}
.pop.think .pthink{display:block}
.pthink textarea{display:block;width:100%;margin-bottom:8px;padding:10px 12px;border:0;outline:0;resize:none;border-radius:14px;background:var(--tray);box-shadow:inset 0 0 0 1px var(--bd);color:inherit;font:400 16px/22px var(--font)}
.pthink .get{margin-left:auto;display:grid}
/* a short word at the bottom when something is done */
.toast{position:absolute;z-index:20;left:50%;bottom:calc(var(--tbb) + 64px);height:36px;padding:0 14px 0 10px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;white-space:nowrap;opacity:0;transform:translate(-50%,8px) scale(.96);pointer-events:none;transition:opacity .2s,transform .25s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{width:16px;height:16px}
@media(hover:hover) and (pointer:fine){.pmenu button:hover,.toc button:hover{background:var(--tray)}.brow:hover .get:not(.pri){background:var(--bg)}}

/* notes: search, filters, groups */
.chips{display:flex;gap:6px;margin:8px calc(-1*var(--gut)) 0;padding:0 var(--gut) 4px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;max-width:220px;height:32px;padding-inline:12px;border-radius:10px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--ink-3);background:var(--tray);box-shadow:inset 0 0 0 1px var(--bd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .2s,color .2s,transform .14s var(--ease)}
.chipb:active{transform:scale(.97)}
.chipb i{font-style:normal;font-weight:400;opacity:.6;font-variant-numeric:tabular-nums}
.chipb[aria-pressed="true"]{background:var(--cell);color:var(--ink);box-shadow:inset 0 0 0 1px var(--bd),var(--sh)}
.notes{margin-top:8px}
.ghead{margin:16px 0 0;padding-inline:14px;font-size:13px;line-height:18px;font-weight:500;color:var(--ink-3)}
.ghead:first-child{margin-top:4px}
.ntag{flex:none;height:24px;margin-right:8px;padding-inline:8px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:500;color:var(--ink-2);background:var(--bg)}
.note input.ng{display:block;width:calc(100% - 28px);height:36px;margin:12px 14px 0;padding-inline:12px;border-radius:10px;outline:0;background:var(--bg);font-size:15px}
.note input.ng::placeholder{color:var(--ink-4)}

/* code bar and hidden items */
.app.asking .ldock{opacity:0;pointer-events:none}
.codebar{position:absolute;z-index:6;left:var(--gut);right:var(--gut);bottom:var(--tbb);height:48px;display:flex;align-items:center;gap:8px;padding:0 4px 0 16px;border-radius:16px;background:var(--cell);
  visibility:hidden;clip-path:inset(0 0 0 calc(100% - 48px) round 16px);transition:clip-path .36s var(--ease),visibility 0s .36s}
.codebar.on{visibility:visible;clip-path:inset(0 round 16px);transition:clip-path .36s var(--ease)}
.codebar input{flex:1;min-width:0;outline:0;font-size:17px;letter-spacing:.2em}
.codebar input::placeholder{letter-spacing:0;color:var(--ink-4)}
.codebar.bad{animation:shake .32s var(--ease)}
@keyframes shake{20%{transform:translateX(-7px)}45%{transform:translateX(6px)}70%{transform:translateX(-3px)}}
.relock{position:absolute;z-index:2;top:28px;right:var(--gut);height:32px;padding:0 12px 0 10px;border-radius:10px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-3);background:var(--cell)}
.relock svg{width:16px;height:16px}
.brow.lk .cv{background:var(--cell)!important;color:var(--ink-4)!important}
.brow.lk .cv>*{display:none}
.brow.lk .et b{color:var(--ink-3)}
.get svg{width:16px;height:16px}
.lockn{display:flex;align-items:center;gap:8px;width:100%;padding:16px 20px;color:var(--ink-3);font-size:15px;text-align:left}
.lockn svg{width:16px;height:16px;flex:none}

/* ================= light pass: flat, regular, quiet =================
   No outlines and no shadows: a surface is told from the page only by a soft fill.
   Titles are regular; medium is kept for what you press; nothing is bold. */
:root{--bg:#212121;--tray:#282828;--cell:#2f2f2f;--bd:transparent;--sh:0 0 0 transparent;--ink:#ececec;--ink-2:#d0d0d0;--ink-3:#a0a0a0;--ink-4:#767676;--pri:#ececec;--pri-on:#212121;--light:#ececec;--line:#ffffff14;--line-2:#ffffff1f}
:root[data-read="light"]{--bg:#ffffff;--tray:#f9f9f9;--cell:#f3f3f3;--bd:transparent;--sh:0 0 0 transparent;--ink:#0d0d0d;--ink-2:#333333;--ink-3:#6b6b6b;--ink-4:#a3a3a3;--pri:#0d0d0d;--pri-on:#ffffff;--light:#0d0d0d;--line:#0000000f;--line-2:#0000001a}
:root[data-read="paper"]{--bg:#faf9f5;--tray:#f5f3ec;--cell:#efede5;--bd:transparent;--sh:0 0 0 transparent;--ink:#1f1e1b;--ink-2:#3d3b36;--ink-3:#73706a;--ink-4:#a8a59c;--pri:#1f1e1b;--pri-on:#faf9f5;--light:#1f1e1b;--line:#1f1e1b12;--line-2:#1f1e1b1f}
body{font-size:16px;letter-spacing:-.011em}
.lt{font-size:28px;line-height:34px;font-weight:400;letter-spacing:-.02em;margin-bottom:16px}
.sec{margin:32px 0 8px;font-size:14px;line-height:20px;font-weight:400;letter-spacing:0;color:var(--ink-3)}
.bp-t{font-size:22px;line-height:28px;font-weight:500;letter-spacing:-.015em}
.pillb,.act,.hold{font-size:15px;font-weight:500;letter-spacing:-.005em;height:44px;border-radius:22px}
.get{font-size:14px;font-weight:400;border-radius:16px;background:var(--cell)}
.get.pri{font-weight:500}
.st{font-weight:500;font-size:16px}
.et b,.chr b,.facts,.bp-x,.toc button,.search input{font-size:16px;letter-spacing:-.011em}
.et i{font-size:14px}
.seg button,.seg.big button{font-weight:400;font-size:14px}
.seg button[aria-pressed="true"]{font-weight:500}
.cv b{font-weight:400}
.chipb,.toast,.ghead,.ntag{font-weight:400}
/* flat list: rows are not boxes; they only fill under the finger */
.search{border-radius:22px;background:var(--cell)}
.rows{gap:0;margin-top:8px}
.brow{background:none;box-shadow:none;border-radius:12px;padding:8px}
.brow:active{background:var(--tray);transform:none}
.cv.th{border-radius:8px;width:44px}
.seg.big,.seg.big .th,.seg.big button{border-radius:24px}
.seg.big{height:44px;width:208px}
#add,.round{width:44px;height:44px;border-radius:22px}
.job,.codebar{height:44px;border-radius:22px}
.job{clip-path:inset(0 0 0 calc(100% - 44px) round 22px)}
.job.on,.codebar.on{clip-path:inset(0 round 22px)}
.codebar{clip-path:inset(0 0 0 calc(100% - 44px) round 22px)}
.rpill{height:44px;border-radius:22px}
.rpill span{height:32px;border-radius:16px;background:var(--tray)}
/* notes: no outer box; the quote is one soft block */
.note{padding:0;background:none;border-radius:0}
.note .nq{background:var(--tray);border-radius:18px;padding:16px}
.nthought,.nadd,.note textarea.nt{margin:10px 16px 0;width:calc(100% - 32px)}
.note input.ng{margin:10px 16px 0;width:calc(100% - 32px)}
.nfoot{padding-left:16px;margin-top:2px}
.notes{gap:20px}
.chipb{border-radius:16px;background:none}
.chipb[aria-pressed="true"]{background:var(--cell)}
.lockn{background:var(--tray);border-radius:18px}
/* book page */
.chr{background:none;padding:12px 4px;border-radius:0;margin:0}
.chr+.chr::before{display:block}
.facts{background:none;padding:0 4px}
.cc.q{background:var(--tray)}
.pop{box-shadow:0 0 0 1px var(--line),0 12px 32px var(--shade)}
.sheet{box-shadow:0 0 0 1px var(--line)}
.toast{background:var(--pri);color:var(--pri-on);border-radius:18px}
@media(hover:hover) and (pointer:fine){.brow:hover{background:var(--tray)}}

/* scrubber and slider: one thin line, a filled part, a round handle */
.ruler{height:28px;margin:14px 10px 2px;background:none}
.ruler::before{content:"";position:absolute;left:0;right:0;top:12px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ink) calc(var(--p,0)*100%),var(--cell) 0)}
.ruler u{top:10px;bottom:auto;width:2px;height:8px;margin-left:-1px;border-radius:1px;background:var(--ink-4)}
.ruler i{top:6px;bottom:auto;width:16px;height:16px;margin-left:-8px;border:0;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--tray)}
.ruler:active i{transform:scale(1.2)}
.ruler i{z-index:1}
.thead{border-bottom:0;padding-bottom:4px}
.thead p{margin-top:6px}
.rng{height:24px}
.rng::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ink) calc(var(--v,0)*100%),var(--cell) 0)}
.rng::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ink) calc(var(--v,0)*100%),var(--cell) 0)}
.rng::-webkit-slider-thumb{width:16px;height:16px;margin-top:-6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--tray)}
.rng::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--tray)}
.sheet .seg{background:var(--cell)}
.sheet .seg .th{background:var(--bg)}
.toc button.now{background:var(--cell);box-shadow:none}
.note.lockn{padding:14px 16px}

/* the book page is a sheet over the list: rounded top, a handle, the list stepped back behind it */
.bpage{inset:28px 0 0;border-radius:28px 28px 0 0;overflow:hidden;background:var(--tray);transition:clip-path .42s var(--ease),transform .32s var(--ease),visibility 0s .42s}
.bpage.on{transition:clip-path .42s var(--ease),transform .32s var(--ease)}
.bgrab{position:absolute;z-index:2;top:0;left:0;right:0;height:28px;touch-action:none;cursor:grab}
.bgrab::before{content:"";position:absolute;top:8px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line-2)}
.bback{top:20px;z-index:3;background:var(--cell)}
.bscroll{padding-top:76px}
.scroll,.ldock{transition:transform .42s var(--ease),opacity .3s var(--ease)}
.scroll{transform-origin:50% 0}
.app.deep .scroll{transform:scale(.94);opacity:.4}
.app.deep .ldock,.app.deep .relock{opacity:0;pointer-events:none}
.bpage .pillb.sub,.bpage .get{background:var(--cell)}
.bpage .cc.q{background:var(--cell)}
.bgrab{display:block;width:100%;height:32px}
.bscroll{padding-top:44px}

/* hidden things live in one locked row at the end of the list */
.hidrow{display:flex;align-items:center;gap:12px;width:100%;height:52px;margin-top:8px;padding:0 12px 0 20px;border-radius:12px;color:var(--ink-3);text-align:left;font-size:16px}
.hidrow:active{background:var(--tray)}
.hidrow span{flex:1}
.hidrow svg{width:18px;height:18px;flex:none}
.hidrow svg:last-child{width:12px;height:12px;color:var(--ink-4)}
.notes .hidrow{margin-top:0;padding-left:16px}
.relock{color:var(--ink);font-weight:500}
.relock svg{display:none}
.relock{padding-inline:14px;border-radius:16px}
/* the two quiet actions at the foot of the book sheet sit together */
button.quiet{display:block;width:100%;height:44px;margin-top:32px;border-radius:22px;background:var(--cell);font-size:15px;font-weight:500}
button.quiet:active{transform:scale(.98)}
.bpage .hold{margin-top:8px}

/* whatever runs past an edge fades out instead of being cut */
.chips,.car{-webkit-mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 44px),transparent);mask-image:linear-gradient(90deg,transparent,#000 16px,#000 calc(100% - 44px),transparent)}
.ldock::before{content:"";position:absolute;z-index:-1;left:calc(-1*var(--gut));right:calc(-1*var(--gut));top:-28px;bottom:calc(-1*var(--tbb));background:linear-gradient(transparent,var(--bg) 62%);pointer-events:none}
.bscroll{-webkit-mask-image:linear-gradient(#000 calc(100% - 40px),transparent);mask-image:linear-gradient(#000 calc(100% - 40px),transparent)}
.toc{-webkit-mask-image:linear-gradient(#000 calc(100% - 28px),transparent);mask-image:linear-gradient(#000 calc(100% - 28px),transparent);padding-bottom:20px}
#codeforgot{flex:none;white-space:nowrap;font-size:13px;color:var(--ink-3);margin:0;height:36px}
#codeforgot.ask{color:var(--danger)}
.seg button:focus-visible{outline:0}
.seg button[aria-pressed="true"] svg{width:18px;height:18px}
.pmenu svg{width:20px;height:20px}
#psave.ok svg{fill:none}
#psave.ok svg path:last-child{fill:currentColor}

/* adding a book: a ring that fills, the file's name, and what is happening to it */
.job{gap:10px;padding:0 16px 0 6px}
.job>*{opacity:0;transition:opacity .15s}
.job.on>*{opacity:1;transition:opacity .25s .18s}
.jring{width:32px;height:32px;flex:none;display:grid}
.jring svg{width:32px;height:32px;stroke-width:2}
.jring .tr{stroke:var(--line-2);transition:fill .25s,stroke .25s}
.jring .ar{stroke:var(--ink);stroke-dasharray:calc(var(--k,0)*100) 100;transition:stroke-dasharray .35s var(--ease),opacity .2s;transform-box:fill-box;transform-origin:center}
.jring.spin .ar{stroke-dasharray:22 100;animation:jspin .9s linear infinite}
@keyframes jspin{from{transform:rotate(-90deg)}to{transform:rotate(270deg)}}
.jring .ck{stroke:var(--pri-on);stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .28s var(--ease) .12s}
.jring .ex{stroke:var(--danger);opacity:0}
.jring.ok svg{animation:jpop .4s var(--ease)}
@keyframes jpop{0%{transform:scale(.8)}55%{transform:scale(1.12)}100%{transform:none}}
.jring.ok .tr{fill:var(--pri);stroke:var(--pri)}
.jring.ok .ar{opacity:0}
.jring.ok .ck{stroke-dashoffset:0}
.jring.bad .tr{stroke:var(--danger)}
.jring.bad .ar{opacity:0}
.jring.bad .ex{opacity:1}
.jmain{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;overflow:hidden}
.jmain b{min-width:0;flex:0 1 auto;font-weight:400;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jmain i{flex:none;font-style:normal;font-size:14px;color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.job.bad .jmain i{color:var(--danger)}
.job.bad .jmain b{display:none}
.job em{flex:none;font-size:13px;color:var(--ink-3)}
.job>.jring{flex:none;display:grid;overflow:visible}
.job>.jmain{flex:1;display:flex}
.job .jmain b{height:auto;min-width:0;padding:0;border-radius:0;display:block;background:none;font-size:15px;line-height:20px}
.job .jmain i{width:auto;height:auto;background:none;line-height:20px}
.job>span.jmain{display:flex;flex:1;align-items:center}
.job>span.jring{flex:none;display:grid}
/* search */
.search .ni{margin:0 -10px 0 0;flex:none;position:static}
.rows .ghead{margin:20px 0 4px;padding-inline:8px}
.rows .ghead:first-child{margin-top:8px}
.gsub{margin:12px 0 0;padding-inline:8px;font-size:15px;line-height:20px;color:var(--ink)}
.more{align-self:flex-start;height:32px;margin:2px 0 4px;padding-inline:8px;font-size:14px;color:var(--ink-3)}
.more:not(:disabled):active{color:var(--ink)}
.brow .et b.wrap{font-size:15px;line-height:21px;color:var(--ink-2)}
.rows mark{background:var(--mark);color:var(--ink);padding:.05em .1em}
.hidrow.ask{color:var(--danger)}
@keyframes flash{0%,60%{background:var(--mark);box-shadow:0 0 0 6px var(--mark)}100%{background:transparent;box-shadow:0 0 0 6px transparent}}
article .flash{animation:flash 1.8s var(--ease)}
/* writing a thought: the menu widens into a calm field */
.pop{transition:opacity .15s,transform .22s var(--ease),top .2s var(--ease),left .2s var(--ease),width .25s var(--ease)}
.pop.think{width:min(320px,calc(100% - 24px))}
.pthink{padding:0 6px 6px}
.pthink textarea{margin:0;padding:12px 14px;border-radius:14px;background:var(--bg);box-shadow:none;font-size:16px;line-height:22px;overflow-y:auto;scrollbar-width:none}
.pthink textarea::-webkit-scrollbar{display:none}
.pthink textarea::placeholder{color:var(--ink-4)}
.pfoot{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}

  h.addEventListener('pointermove',e=>{if(!g||e.pointerId!==g.id)return;const dy=e.clientY-g.y,dt=Math.max(1,e.timeStamp-g.lt);g.v=.7*(e.clientY-g.ly)/dt+.3*g.v;g.ly=e.clientY;g.lt=e.timeStamp;bpage.style.transform='translateY('+(dy>0?dy:dy*.15)+'px)'});

    if(e.type==='pointerup'&&Math.abs(dy)<6)return closePage(); /* a tap on the handle closes too */
    if(e.type==='pointerup'&&dy+q.v*200>120){bpage.style.clipPath=DOWN;app.classList.remove('deep');pageBook=null;bpage.classList.remove('on');bpage.setAttribute('aria-hidden','true')}};
  h.addEventListener('pointerup',end);h.addEventListener('pointercancel',end)}
function renderPage(b){
  const v=$('bbody'),at=posOf(b),read=el('button','pillb',verb(b)),row=el('div','rowb');v.textContent='';
  read.onclick=()=>openBook(b);row.appendChild(read);
  v.append(cover(b,'bp-cv'),el('h2','bp-t',b.title));if(b.author)v.appendChild(el('p','bp-a',b.author));
  const lk=el('button','quiet',b.locked?'Вернуть из скрытых':'Скрыть'),flip=()=>{b.locked=!b.locked;saveBook(b);closePage();render();toast(b.locked?'Перенесена в скрытые':'Возвращена в книги')};
  lk.onclick=()=>lockHash?flip():ask(flip,true);
  v.append(el('p','bp-m',[b.fmt,state(b)].join(' · ')),row);
  const ex=excerpt(b,420);if(ex)v.append(el('h3','sec','Начало'),el('p','bp-x',ex));
  const heads=[];b.blocks.forEach((x,i)=>{if(x[0]==='h')heads.push([i,x[1]])});
  if(heads.length){
    let now=-1;heads.forEach((h,k)=>{if(h[0]<=at.i)now=k});
    v.appendChild(el('h3','sec','Главы'));
    (allCh?heads:heads.slice(0,8)).forEach((h,k)=>{const r=el('button','chr'+(k===now&&pct(b)>0?' now':''));r.append(el('span','',String(k+1).padStart(2,'0')),el('b','',h[1]));r.onclick=()=>openBook(b,{i:h[0],f:0});v.appendChild(r)});
    if(!allCh&&heads.length>8){const m=el('button','pillb sub','Все главы · '+heads.length),w=el('div','rowb');m.onclick=()=>{allCh=true;renderPage(b)};w.appendChild(m);v.appendChild(w)}
  }
  const mine=notes.filter(n=>n.book===b.id).sort((x,y)=>x.i-y.i);
  if(mine.length)v.append(el('h3','sec','Заметки'),ribbon(mine.map(n=>{const c=el('button','cc q');c.append(el('p','',n.text),el('i','',n.chapter||b.title));c.onclick=()=>openBook(b,{i:n.i,f:0});return c})));
  const f=el('dl','facts'),fact=(k,x)=>f.append(el('dt','',k),el('dd','',x));
  fact('Формат',b.fmt);fact('Объём',b.words.toLocaleString('ru')+' слов');fact('Время чтения',mins(b.words/WPM));if(heads.length)fact('Глав',String(heads.length));if(b.date)fact('Добавлена',new Date(b.date).toLocaleDateString('ru',{day:'numeric',month:'long'}));
  v.append(el('h3','sec','Сведения'),f);
  const rm=el('button','hold');let tm=0;rm.append(el('i'),el('span','h1','Убрать книгу'),el('span','h2','Удерживайте, чтобы убрать'));let t0=0,tip=0;
  const stop=()=>{clearTimeout(tm);if(!rm.classList.contains('go'))return;rm.classList.remove('go');if(Date.now()-t0<350){rm.classList.add('tip');clearTimeout(tip);tip=setTimeout(()=>rm.classList.remove('tip'),1800)}};
  rm.onpointerdown=()=>{t0=Date.now();clearTimeout(tip);rm.classList.remove('tip');rm.classList.add('go');tm=setTimeout(()=>{
    books=books.filter(x=>x!==b);ls.del('pos-'+b.id);ls.del('open-'+b.id);if(b.sample)ls.set('no-sample',1);else idb('readwrite',s=>s.delete(b.id));
    pageBook=null;bpage.style.clipPath=DOWN;bpage.classList.remove('on');app.classList.remove('deep');render()},still?400:1100)};
  rm.onpointerup=rm.onpointerleave=rm.onpointercancel=stop;rm.oncontextmenu=e=>e.preventDefault();

/* ---------- reader ---------- */
const FONTS=[['Inter',"Inter,-apple-system,'Segoe UI',Roboto,sans-serif"],['Plex',"'IBM Plex Sans','Segoe UI',Roboto,sans-serif"],['Literata',"Literata,'Iowan Old Style',Georgia,serif"],['Source',"'Source Serif 4',Georgia,serif"]];
const WEIGHTS=[[400,'Обычная'],[500,'Плотнее']];
const THEMES=[['dark','Тёмный'],['light','Светлый'],['paper','Бумага']];
const ui=Object.assign({fs:19,font:0,fw:400,theme:'light',focus:false},ls.get('reader-ui-2',{}));
if(!THEMES.some(t=>t[0]===ui.theme))ui.theme='light';
// One-time adoption of the new light default; later user choices remain intact.
if(!ls.get('light-design-1',false)){ui.theme='light';ui.focus=false;ls.set('light-design-1',true)}
function applyUi(){
  const at=cur?where():null,r=document.documentElement;
  if(ui.theme==='dark')delete r.dataset.read;else r.dataset.read=ui.theme;
  document.querySelector('meta[name="theme-color"]').content=ui.theme==='dark'?'#212121':ui.theme==='paper'?'#faf9f5':'#ffffff';
  r.style.setProperty('--fs',ui.fs+'px');r.style.setProperty('--read',FONTS[ui.font][1]);r.style.setProperty('--fw',ui.fw);
  reader.classList.toggle('plain',!ui.focus);$('fval').textContent=ui.fs;$('fsize').value=ui.fs;$('fsize').style.setProperty('--v',(ui.fs-15)/13);ls.set('reader-ui-2',ui);
  if(at){goTo(at);tick()}
}
seg('fonts',FONTS.map(f=>f[0]),()=>ui.font,i=>ui.font=i,applyUi,FONTS.map(f=>f[1]));
seg('weights',WEIGHTS.map(w=>w[1]),()=>WEIGHTS.findIndex(w=>w[0]===ui.fw),i=>ui.fw=WEIGHTS[i][0],applyUi);
seg('themes',THEMES.map(t=>t[1]),()=>THEMES.findIndex(t=>t[0]===ui.theme),i=>ui.theme=THEMES[i][0],applyUi);
seg('focus',['Вкл','Выкл'],()=>ui.focus?0:1,i=>ui.focus=i===0,applyUi);
$('fsize').oninput=e=>{ui.fs=+e.target.value;applyUi()};

let heads=[],first=0; /* first = index of the first real block among the article's children */
const blockEl=i=>text.children[first+i];
const padTop=()=>parseFloat(getComputedStyle(rscroll).paddingTop)||0;
function where(){ /* which block sits at the reading line, and how far into it */
  const kids=text.children,y=rscroll.scrollTop+padTop();let lo=first,hi=kids.length-1;
  while(lo<hi){const m=(lo+hi+1)>>1;if(kids[m].offsetTop<=y)lo=m;else hi=m-1}
  const k=kids[lo];if(!k)return {i:0,f:0};
  return {i:lo-first,f:Math.max(0,Math.min(1,(y-k.offsetTop)/Math.max(1,k.offsetHeight)))};
}
function goTo(at){const k=blockEl(at.i);if(k)rscroll.scrollTop=k.offsetTop-padTop()+at.f*k.offsetHeight}
function progress(){const max=rscroll.scrollHeight-rscroll.clientHeight;return max>0?Math.max(0,Math.min(1,rscroll.scrollTop/max)):1}
let raf=0,saveT=0,lastY=0;
let lastPercent=-1,lastChapter=null,lastRemaining='';
function tick(){
  raf=0;if(!cur)return;
  const p=progress(),percent=p>=.995?100:Math.min(99,Math.round(p*100)),remaining=p>=.995?'Дочитано':'Осталось '+mins(cur.words*(1-p)/WPM);
  const y=rscroll.scrollTop+padTop()+8;
  let lo=0,hi=heads.length-1,h=null;
  while(lo<=hi){const m=(lo+hi)>>1;if(heads[m].el.offsetTop<=y){h=heads[m];lo=m+1}else hi=m-1}
  // All layout reads precede DOM writes; update labels only when changed.
  if(percent!==lastPercent){$('rchip').innerHTML=p>=.995?okSvg:ringSvg(p);$('rchip').append(percent+'%');lastPercent=percent}
  if(remaining!==lastRemaining){$('tleft').textContent=remaining;lastRemaining=remaining}
  const name=h?h.s:cur.title;if($('rname').textContent!==name)$('rname').textContent=name;
  if(h!==lastChapter){if(lastChapter&&lastChapter.btn)lastChapter.btn.classList.remove('now');if(h&&h.btn)h.btn.classList.add('now');lastChapter=h}
  if(sheetOn())ruler.style.setProperty('--p',p);
}
function savePos(){if(cur)ls.set('pos-'+cur.id,Object.assign(where(),{p:progress()}))}

/* the ruler scrubs the book */
const ruler=$('ruler');
function ticks(){
  ruler.querySelectorAll('u').forEach(u=>u.remove());const max=Math.max(1,rscroll.scrollHeight-rscroll.clientHeight);
  heads.forEach(h=>{const u=el('u');u.style.left=Math.min(100,(h.el.offsetTop-padTop())/max*100)+'%';ruler.appendChild(u)});
}
{let on=false;const move=e=>{const r=ruler.getBoundingClientRect(),p=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));rscroll.scrollTop=p*(rscroll.scrollHeight-rscroll.clientHeight);tick()};
  ruler.addEventListener('pointerdown',e=>{on=true;try{ruler.setPointerCapture(e.pointerId)}catch(_){}move(e)});
  ruler.addEventListener('pointermove',e=>{if(on)move(e)});
  const end=()=>{on=false};ruler.addEventListener('pointerup',end);ruler.addEventListener('pointercancel',end)}
/* sheets above the bottom row */
const sheetOn=()=>reader.classList.contains('s-set')||reader.classList.contains('s-toc');
function sheet(w){
  reader.classList.remove('s-set','s-toc');if(!w)return;
  reader.classList.add('s-'+w);segs.forEach(f=>f());
  if(w==='toc'){tick();ticks();const n=$('toc').querySelector('.now');if(n)n.parentNode.scrollTop=n.offsetTop-n.parentNode.clientHeight/2}
}
$('aa').onclick=()=>sheet(reader.classList.contains('s-set')?null:'set');
$('info').onclick=()=>sheet(reader.classList.contains('s-toc')?null:'toc');

/* kept passages are tinted in the text */
function markBlock(i){
  const e=blockEl(i),s=cur.blocks[i][1],f=s.replace(/\n/g,' ');if(!e)return;
  const cuts=[];for(const n of notes){if(n.book!==cur.id||n.i!==i)continue;const a=f.indexOf(n.text.replace(/\n/g,' '));if(a>=0)cuts.push([a,a+n.text.length])}
  e.textContent='';if(!cuts.length){e.textContent=s;return}
  cuts.sort((a,b)=>a[0]-b[0]);let at=0;
  for(const [a,b] of cuts){if(a<at)continue;if(a>at)e.append(s.slice(at,a));e.appendChild(el('mark','',s.slice(a,b)));at=b}
  if(at<s.length)e.append(s.slice(at));
}
const chapterOf=i=>{for(let k=i;k>=0;k--)if(cur.blocks[k][0]==='h')return cur.blocks[k][1];return ''};
/* a pick is a tapped block or words selected by hand; the bottom row then offers to copy or keep it */
let picked=null,holdSel=0;
const same=p=>n=>n.book===cur.id&&n.i===p.i&&flat(n.text)===flat(p.text);
const pop=$('pop');
function unpick(){if(picked&&picked.box)picked.box.classList.remove('pick','keep');picked=null;reader.classList.remove('pick');pop.classList.remove('on','think')}
function drop(){try{getSelection().removeAllRanges()}catch(e){}unpick()}
/* the menu sits right under the passage, or above it when there is no room */
function place(){
  if(!picked)return;const r=picked.box.getBoundingClientRect(),v=reader.getBoundingClientRect(),h=pop.offsetHeight,w=pop.offsetWidth;
  let top=r.bottom-v.top+10;if(top+h>v.height-16)top=r.top-v.top-h-10;
  pop.style.top=Math.max(12,Math.min(v.height-h-12,top))+'px';pop.style.left=Math.max(12,Math.min(v.width-w-12,r.left-v.left))+'px';
}
function setSaved(){
  const n=picked&&notes.find(same(picked));$('psave').classList.toggle('ok',!!n);
  $('psave').querySelector('span').textContent=n?'Сохранено':'Сохранить';$('pthink').querySelector('span').textContent=n&&n.thought?'Изменить мысль':'Добавить мысль';
}
function pick(p){
  if(picked&&picked.box)picked.box.classList.remove('pick','keep');
  picked=p;p.box=blockEl(p.i);p.box.classList.add(p.sel?'keep':'pick');sheet(null);reader.classList.remove('quiet');reader.classList.add('pick');
  pop.classList.remove('think');pop.firstElementChild.textContent='Действия';setSaved();place();pop.classList.add('on');
}
function saveNote(p){const n={id:'n'+Date.now(),book:cur.id,title:cur.title,author:cur.author,chapter:chapterOf(p.i),i:p.i,text:p.text,date:Date.now()};notes.unshift(n);return n}
function afterNote(p){keep();holdSel=1;p.sel=false;markBlock(p.i);setTimeout(()=>{holdSel=0},80);bookNotes();setSaved();place()}
$('psave').onclick=()=>{const p=picked;if(!p)return;if(notes.some(same(p)))notes=notes.filter(n=>!same(p)(n));else saveNote(p);afterNote(p)};
$('pcopy').onclick=()=>{const p=picked;if(!p)return;copyText(quote({text:p.text,title:cur.title,author:cur.author}),()=>toast('Скопировано'));drop()};
/* the same menu turns into a field for your thought */
$('pthink').onclick=()=>{const p=picked;if(!p)return;let n=notes.find(same(p));if(!n){n=saveNote(p);afterNote(p)}$('ptext').value=n.thought||'';pop.firstElementChild.textContent='Мысль';pop.classList.add('think');fit();$('ptext').focus({preventScroll:true})};
/* the field grows with what you write, up to a limit, and the menu stays beside the passage */
function fit(){const t=$('ptext');t.style.height='0';t.style.height=Math.min(168,Math.max(66,t.scrollHeight))+'px';place()}
$('ptext').oninput=fit;
$('pback').onclick=()=>{pop.classList.remove('think');pop.firstElementChild.textContent='Действия';setSaved();place()};
$('pdone').onclick=()=>{const p=picked,n=p&&notes.find(same(p));if(n){const t=$('ptext').value.trim();if(t)n.thought=t;else delete n.thought;keep();toast(t?'Мысль сохранена':'Сохранено')}drop()};
document.addEventListener('selectionchange',()=>{
  if(!cur)return;const g=getSelection(),t=g&&!g.isCollapsed?flat(g.toString()):'';
  if(!t){if(picked&&picked.sel&&!holdSel)unpick();return}
  let n=g.anchorNode;while(n&&n.parentNode!==text)n=n.parentNode;if(!n)return;
  const i=[...text.children].indexOf(n)-first;if(i<0)return;
  const f=cur.blocks[i][1].replace(/\n/g,' '),a=f.indexOf(t);if(a<0)return; /* a selection across blocks is left to the system's own copy */
  pick({sel:true,i,text:cur.blocks[i][1].slice(a,a+t.length)});
});
text.addEventListener('click',()=>{
  if(getSelection&&String(getSelection()).trim())return;
  if(sheetOn())sheet(null);
  if(picked)drop();
});
/* the book's own notes sit next to its contents */
let ttab=0;
function bookNotes(){
  const box=$('bnotes'),mine=notes.filter(n=>n.book===cur.id).sort((a,b)=>a.i-b.i);box.textContent='';
  if(!mine.length)box.appendChild(el('p','','В этой книге пока нет заметок'));
  mine.forEach(n=>{const b=el('button','q',flat(n.text));b.onclick=()=>{sheet(null);rscroll.scrollTop=blockEl(n.i).offsetTop-padTop()-40;tick()};box.appendChild(b)});
}
const tocTab=()=>{$('toc').hidden=ttab===1;$('bnotes').hidden=ttab!==1};
const placeToc=seg('ttabs',['Главы','Заметки'],()=>ttab,i=>ttab=i,tocTab);

rscroll.addEventListener('scroll',()=>{
  if(!cur)return;
  if(picked&&!pop.classList.contains('think'))drop();
  const y=rscroll.scrollTop,d=y-lastY;lastY=y;if(picked)place();
  if(!sheetOn()&&!picked){if(d>6&&y>80)reader.classList.add('quiet');else if(d<-6)reader.classList.remove('quiet')}
  if(!raf)raf=requestAnimationFrame(tick);
  clearTimeout(saveT);saveT=setTimeout(savePos,300);
},{passive:true});
const KIND={q:'q',s:'s',v:'v'};
function openBook(b,to){
  lastPercent=-1;lastChapter=null;lastRemaining='';cur=b;unpick();sheet(null);reader.classList.remove('quiet');ls.set('open-'+b.id,Date.now());
  text.textContent='';text.lang=b.lang||'ru';heads=[];
  const frag=document.createDocumentFragment();
  frag.appendChild(el('p','bt',b.title));frag.appendChild(el('p','ba',[b.author,mins(b.words/WPM)].filter(Boolean).join(' · ')));first=2;
  for(const [t,s] of b.blocks){
    const e=t==='h'?el('h2','',s):el('p',KIND[t]||'',s);
    if(t==='h')heads.push({el:e,s});frag.appendChild(e);
  }
  text.appendChild(frag);
  new Set(notes.filter(n=>n.book===b.id).map(n=>n.i)).forEach(markBlock);
  const toc=$('toc');toc.textContent='';
  if(!heads.length)toc.appendChild(el('p','','В этой книге не нашлось глав'));
  heads.forEach(h=>{h.btn=el('button','',h.s);h.btn.onclick=()=>{sheet(null);rscroll.scrollTop=h.el.offsetTop-padTop();tick()};toc.appendChild(h.btn)});
  ttab=0;tocTab();placeToc();bookNotes();
  reader.classList.add('on');reader.setAttribute('aria-hidden','false');
  rscroll.scrollTop=0;goTo(to||posOf(b));if(to){rscroll.scrollTop-=40;const e=blockEl(to.i);if(e){e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1800)}}lastY=rscroll.scrollTop;tick();
}
function closeBook(){if(!cur)return;savePos();unpick();sheet(null);cur=null;reader.classList.remove('on');reader.setAttribute('aria-hidden','true');render()}
$('back').onclick=closeBook;
addEventListener('resize',()=>{segs.forEach(f=>f());if(cur&&!raf)raf=requestAnimationFrame(tick)});
addEventListener('pagehide',savePos);document.addEventListener('visibilitychange',()=>{if(document.hidden)savePos()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(picked)drop();else if(sheetOn())sheet(null);else if(cur)closeBook();else closePage()}});
app.addEventListener('scroll',()=>{app.scrollTop=0});

/* ---------- a sample so the first screen is not empty ---------- */

  ['p','Это короткий пример вместо книги. Он нужен, чтобы сразу было видно, как выглядит текст, и чтобы было на чём проверить настройки. Его можно убрать из списка.'],
  ['h','Что она делает'],
  ['p','Вы отдаёте ей файл книги, а она раскладывает его в одну колонку под ширину телефона. Не нужно увеличивать страницу двумя пальцами и водить её из стороны в сторону, чтобы дочитать строку.'],
  ['p','Лучше всего получаются FB2 и EPUB. В этих форматах уже записано, где кончается абзац и где начинается глава, поэтому текст переносится точно.'],

  ['p','Если страницы в PDF — это фотографии, текста в нём нет вовсе. Такой файл Desharhozam честно не откроет и скажет почему.'],
  ['h','Как читать'],
  ['p','Листайте вниз. Панель внизу уйдёт, чтобы не мешать, и вернётся, когда вы прокрутите немного назад.'],
  ['p','Кнопка «Аа» открывает настройки: размер букв, шрифт, насыщенность, фон и фокус. Фокус мягко приглушает строки у краёв экрана, чтобы взгляд держался середины. Если он мешает, его можно выключить.'],
  ['p','Плашка с названием главы открывает оглавление. Оно собирается из заголовков, которые нашлись в книге.'],
  ['h','Цитаты и заметки'],
  ['p','Выделите нужные слова: мышью на компьютере или долгим нажатием на телефоне. Появится небольшое меню: сохранить цитату, скопировать её или добавить свою мысль.'],
  ['p','Сохранённое место подсвечивается в тексте. Все заметки собраны на вкладке «Заметки», оттуда можно вернуться к нужному месту в книге.'],
  ['h','Что она запоминает'],
  ['p','Место, на котором вы остановились, в каждой книге своё. Настройки чтения общие для всех книг. Сами книги хранятся в памяти браузера на этом устройстве и никуда не отправляются.'],
  ['s','* * *'],
  ['p','В плашке виден процент прочитанного, а в оглавлении — сколько примерно осталось. Время считается из расчёта спокойного темпа, около ста семидесяти слов в минуту.']]};
SAMPLE.words=SAMPLE.blocks.reduce((n,x)=>n+x[1].split(/\s+/).length,0);

(async function(){
  applyUi();
  SAMPLE.locked=!!ls.get('s-lock',false);
  if(!ls.get('no-sample',0))books=[SAMPLE];go('home');segs.forEach(f=>f());
  await idbOpen();
  const saved=(await idb('readonly',s=>s.getAll()))||[];
  if(saved.length){books=saved.concat(books);render()}
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>segs.forEach(f=>f()));
})();
})();
</script>
